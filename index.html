<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CS Elétrica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      color: #ffc400;
      font-size: 36px;
      margin: 0;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
    }

    .botao {
      background: #25D366;
      color: white;
      padding: 15px 25px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
      margin-top: 15px;
    }

    section {
      padding: 40px 20px;
      text-align: center;
    }

    .servicos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .servicos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>CS Elétrica</h1>
  <p>Serviços elétricos com qualidade e segurança</p>
  <a class="botao" href="https://wa.me/5548998199501">Fale no WhatsApp</a>
</header>

<section>
  <h2>Serviços</h2>
  <div class="servicos">
    <div class="card">Instalações elétricas</div>
    <div class="card">Manutenção residencial</div>
    <div class="card">Quadro de disjuntores</div>
    <div class="card">Iluminação e tomadas</div>
  </div>
</section>

<section>
  <h2>Atendimento</h2>
  <p>Atendemos Governador Celso Ramos e região</p>
</section>

<footer>
  <p>CS Elétrica © 2026</p>
</footer>

</body>
</html>
